[project]
name = "dbt-sentinel"
version = "0.6.2"
description = "AI-grounded root-cause analysis for failing dbt tests"
license = "MIT"
keywords = ["dbt", "data-quality", "observability", "analytics-engineering", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
readme = "README.md"
authors = [
    { name = "Qamar Raza", email = "raza.qamar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click==8.1.7",
    "duckdb==1.1.3",
    "httpx==0.28.1",
    "python-dotenv>=1.2.2",
    "rich==13.9.4",
]

[project.optional-dependencies]
bq = ["google-cloud-bigquery>=3.43.0"]
ui = ["streamlit>=1.40"]

[project.urls]
Homepage = "https://github.com/qraza/dbt-sentinel"
Repository = "https://github.com/qraza/dbt-sentinel"
Issues = "https://github.com/qraza/dbt-sentinel/issues"

[project.scripts]
sentinel = "dbt_sentinel.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
bq = [
    "google-cloud-bigquery>=3.43.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
ui = [
    "pandas>=3.0.5",
    "streamlit>=1.61.1",
]


